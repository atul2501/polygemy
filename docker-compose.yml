# Same file on the local PC and on Stockholm; the env file decides which environment it is.
#   docker compose --env-file .env.local up -d       (local)
#   docker compose --env-file .env.stockholm up -d   (Stockholm)
name: polygemy

x-engine: &engine
  image: polygemy-engine:${IMAGE_TAG:-dev}
  build:
    context: .
    dockerfile: docker/engine.Dockerfile
    args:
      GIT_SHA: ${GIT_SHA:-dev}
  env_file: ${ENV_FILE:?set ENV_FILE to .env.local or .env.stockholm}
  environment:
    # Inside the compose network Postgres is "postgres", not 127.0.0.1.
    DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:17.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    # Loopback only: PostgreSQL is never exposed publicly. Reach Stockholm's through an SSH tunnel.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: a new release's migrations are applied before its engine starts.
  migrate:
    <<: *engine
    command: ["migrate"]
    restart: "no"

  engine:
    <<: *engine
    command: ["run"]
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "polygemy-engine", "check"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  pgdata:
