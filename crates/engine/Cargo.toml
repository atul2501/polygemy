[package]
name = "polygemy-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
# Real order execution through Polymarket's official Rust SDK. Not built by default: a default build
# cannot place orders at all.
live = ["dep:polymarket_client_sdk_v2", "dep:alloy"]

[dependencies]
polymarket_client_sdk_v2 = { version = "=0.9.0", optional = true, features = ["clob"] }
alloy = { version = "1.6.3", optional = true, default-features = false, features = ["signers", "signer-local"] }
anyhow = "1"
chrono = "0.4.45"
fastrand = "2.5.0"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
rust_decimal = "1.43.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "macros", "json", "uuid", "chrono", "rust_decimal"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
