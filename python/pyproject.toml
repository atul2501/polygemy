[project]
name = "polygemy"
version = "0.1.0"
description = "Research, model training and management API for the Polymarket BTC 5-minute engine"
requires-python = ">=3.11,<3.13"
dependencies = [
    "psycopg[binary]>=3.2,<4",
    "psycopg-pool>=3.2,<4",
]

[project.optional-dependencies]
# Management API and dashboard backend (runs on Stockholm next to the engine).
api = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "argon2-cffi>=23.1,<26",
    "psutil>=6,<8",
    "httpx>=0.27,<1",
]
# Model research and training (local PC only; production inference runs in Rust).
research = [
    "numpy>=2.1,<3",
    "pandas>=2.2,<3",
    "pyarrow>=18,<22",
    "scikit-learn>=1.5,<2",
    "lightgbm>=4.5,<5",
    "xgboost>=2.1,<4",
    "catboost>=1.2,<2",
    "hmmlearn>=0.3.3,<0.4",
]

[dependency-groups]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
